<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>INVENTORY &amp; ARMOR</title>
  <meta property="og:title" content="Inventory & Armor">
  <meta property="og:description" content="An index of form, material and weight. Painfully Hueman.">

  <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --hh: 64px;          /* header height, set by script */
    --ink: #000;
    --paper: #fff;
    --soft: #8a8a8a;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Courier New", Courier, monospace;
    -webkit-font-smoothing: antialiased;
    text-transform: uppercase;
  }

  button, input {
    font-family: inherit;
    color: inherit;
    text-transform: inherit;
  }

  button:focus {
    outline: none;
  }

  button:focus-visible {
    outline: 1px dashed var(--ink);
    outline-offset: 3px;
  }

  /* HEADER */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 20px;
    padding: 14px 40px;
    background: var(--paper);
    border-bottom: 1px solid var(--ink);
  }

  .title {
    padding: 0;
    border: 0;
    background: none;
    font-size: 12px;
    letter-spacing: 0.15em;
    cursor: pointer;
  }

  .tools {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .search {
    display: flex;
    align-items: center;
    border: 1px solid var(--ink);
  }

  .search input {
    width: 240px;
    height: 34px;
    padding: 0 10px;
    border: 0;
    outline: 0;
    background: transparent;
    font-size: 12px;
    letter-spacing: 0.08em;
  }

  .search input::placeholder {
    color: #999;
  }

  .search input::-webkit-search-cancel-button {
    display: none;
  }

  .search button {
    display: none;
    height: 34px;
    padding: 0 10px;
    border: 0;
    border-left: 1px solid var(--ink);
    background: var(--paper);
    font-size: 10px;
    letter-spacing: 0.12em;
    cursor: pointer;
  }

  .search.has-text button {
    display: block;
  }

  .btn {
    height: 36px;
    padding: 0 12px;
    border: 1px solid var(--ink);
    background: var(--paper);
    font-size: 11px;
    letter-spacing: 0.14em;
    white-space: nowrap;
    cursor: pointer;
  }

  .btn:hover,
  .btn.on {
    background: var(--ink);
    color: var(--paper);
  }

  /* INTRO */
  .intro {
    padding: 96px 40px 24px;
  }

  .intro h1 {
    font-size: clamp(28px, 5vw, 64px);
    font-weight: 400;
    letter-spacing: 0.12em;
  }

  .intro p {
    margin-top: 16px;
    font-size: 12px;
    letter-spacing: 0.1em;
  }

  .intro .count {
    margin-top: 8px;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--soft);
  }

  /* GALLERY */
  main {
    padding: 40px 40px 20px;
    transition: opacity 0.25s ease;
  }

  main.fading {
    opacity: 0;
  }

  section + section {
    margin-top: 72px;
  }

  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 12px;
    margin-bottom: 36px;
    border-bottom: 1px solid var(--ink);
    font-size: 12px;
    letter-spacing: 0.2em;
    scroll-margin-top: calc(var(--hh) + 20px);
  }

  .grid {
    display: grid;
    /* six boxes per row, each the same size as in a seven-across row,
       with the leftover width spread out as space between them */
    grid-template-columns: repeat(6, calc((100% - 120px) / 7));
    justify-content: space-between;
    row-gap: 64px;
  }

  .card {
    display: block;
    align-self: start;
    width: 100%;
    padding: 0;
    border: 0;
    background: none;
    text-align: left;
    cursor: pointer;
  }

  .frame {
    position: relative;
    padding: 10px;
    border: 1px solid var(--ink);
    background: var(--paper);
    transition: box-shadow 0.15s ease;
  }

  .frame img {
    display: block;
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  .frame img.ready {
    opacity: 1;
  }

  .frame .more {
    position: absolute;
    top: 8px;
    right: 10px;
    font-size: 10px;
    letter-spacing: 0.1em;
    background: var(--paper);
  }

  .card:hover .frame {
    box-shadow: 0 0 0 1px var(--ink);
  }

  .meta {
    margin-top: 10px;
    font-size: 10px;
    line-height: 1.6;
    letter-spacing: 0.06em;
  }

  .meta .sec {
    color: var(--soft);
    font-size: 10px;
    letter-spacing: 0.12em;
  }

  .status {
    padding: 40px 0 80px;
    font-size: 12px;
    letter-spacing: 0.15em;
  }

  .status:empty {
    display: none;
  }

  footer {
    padding: 100px 40px 60px;
    font-size: 11px;
    letter-spacing: 0.15em;
  }

  /* DETAIL VIEW */
  #zoom {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    padding: 60px 90px 40px;
    background: rgba(255, 255, 255, 0.97);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    touch-action: pan-y;
  }

  #zoom.open {
    display: flex;
  }

  #zoom-img {
    max-width: 100%;
    max-height: 62vh;
    object-fit: contain;
    border: 1px solid var(--ink);
    background: var(--paper);
    user-select: none;
    -webkit-user-drag: none;
  }

  #zoom-img.multi {
    cursor: pointer;
  }

  #zoom-thumbs {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }

  #zoom-thumbs:empty {
    display: none;
  }

  #zoom-thumbs button {
    width: 52px;
    height: 52px;
    padding: 3px;
    border: 1px solid #ccc;
    background: var(--paper);
    cursor: pointer;
  }

  #zoom-thumbs button.active {
    border-color: var(--ink);
    box-shadow: 0 0 0 1px var(--ink);
  }

  #zoom-thumbs img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .zoom-meta {
    max-width: 640px;
    text-align: center;
    font-size: 12px;
    line-height: 1.7;
    letter-spacing: 0.08em;
  }

  .zoom-meta .sec {
    font-size: 10px;
    letter-spacing: 0.16em;
    color: var(--soft);
  }

  .zoom-btn {
    position: absolute;
    min-width: 44px;
    min-height: 44px;
    padding: 10px 12px;
    border: 0;
    background: none;
    font-size: 11px;
    letter-spacing: 0.2em;
    cursor: pointer;
  }

  .zoom-btn:hover {
    text-decoration: underline;
  }

  #zoom-close { top: 12px; right: 16px; }
  #zoom-prev  { left: 16px; top: 50%; transform: translateY(-50%); }
  #zoom-next  { right: 16px; top: 50%; transform: translateY(-50%); }

  /* SMALLER SCREENS */
  @media (max-width: 1100px) {
    .grid { grid-template-columns: repeat(4, calc((100% - 64px) / 5)); row-gap: 48px; }
  }

  @media (max-width: 700px) {
    header { padding: 12px 16px; gap: 10px; }
    .tools { width: 100%; margin-left: 0; }
    .search { flex: 1; min-width: 0; }
    .search input { flex: 1; width: auto; min-width: 0; font-size: 16px; }
    .btn { padding: 0 9px; font-size: 10px; letter-spacing: 0.1em; }
    .intro { padding: 56px 16px 16px; }
    main { padding: 28px 16px 12px; }
    .grid { grid-template-columns: repeat(3, 1fr); gap: 28px 14px; }
    .frame { padding: 6px; }
    .meta { font-size: 9px; letter-spacing: 0.04em; }
    .meta .sec { font-size: 8px; }
    footer { padding: 72px 16px 48px; }
    #zoom { padding: 56px 16px 84px; }
    #zoom-img { max-height: 52vh; }
    #zoom-prev, #zoom-next { top: auto; bottom: calc(16px + env(safe-area-inset-bottom)); transform: none; border: 1px solid var(--ink); background: var(--paper); }
    #zoom-prev { left: 16px; }
    #zoom-next { right: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    main, .frame img { transition: none; }
  }
</style>
</head>

<body>
  <header id="head">
    <button class="title" id="home" type="button">[ Inventory &amp; Armor ]</button>
    <div class="tools">
      <label class="search" id="search">
        <input id="q" type="search" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search the inventory">
        <button type="button" id="q-clear" aria-label="Clear search">Clear</button>
      </label>
      <button class="btn" id="shuffle" type="button" title="Show everything in a new random order">Shuffle</button>
      <button class="btn" id="by-section" type="button" aria-pressed="false">By section</button>
    </div>
  </header>

  <div class="intro">
    <h1>Inventory &amp; Armor</h1>
    <p>An index of form, material and weight // Painfully Hueman</p>
    <div class="count" id="count" aria-live="polite"></div>
  </div>

  <main id="main">
    <div class="status" id="status">Loading archive...</div>
  </main>

  <footer>Painfully Hueman // Inventory &amp; Armor // Vol. 01</footer>

  <div id="zoom" role="dialog" aria-modal="true" aria-label="Item detail">
    <button class="zoom-btn" id="zoom-close" type="button">[CLOSE]</button>
    <button class="zoom-btn" id="zoom-prev" type="button">[PREV]</button>
    <button class="zoom-btn" id="zoom-next" type="button">[NEXT]</button>
    <img id="zoom-img" alt="">
    <div id="zoom-thumbs"></div>
    <div class="zoom-meta" id="zoom-meta"></div>
  </div>

  <script>
    /* ------------------------------------------------------------
       1. PASTE YOUR GOOGLE SHEET LINK BETWEEN THE QUOTES.
          (File > Share > Publish to web > CSV > copy the link.)
          Leave it empty to see four sample items instead.
       ------------------------------------------------------------ */
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSE513ZgOlmm1qaN-eqwirFBi09oqZS6vCQmrTVoTrXk3NnQhD8lVI5OyTdvrbaYg/pub?output=csv';

    /* ------------------------------------------------------------
       2. SECTION ORDER for the "By section" view (optional).
          Sections listed here come first, in this order. Any other
          section in the sheet still shows up, after these, A to Z.
          The normal view ignores sections and mixes everything.
       ------------------------------------------------------------ */
    const SECTIONS = [
      'armor',
      'outerwear',
      'top',
      'bottoms',
      'footwear',
      'headwear',
      'hardware'
    ];

    /* Sample items, only shown when SHEET_URL is empty. */
    const SAMPLE_ITEMS = [
      { id: '1', section: 'armor',    img: 'images/001.png', maker: 'MAKER NAME', name: 'Sample overshirt', note: 'Placeholder note.', credit: '' },
      { id: '2', section: 'armor',    img: 'images/002.png', maker: 'MAKER NAME', name: 'Sample jacket',    note: '', credit: '' },
      { id: '3', section: 'bottoms',  img: 'images/003.png', maker: 'MAKER NAME', name: 'Sample trouser',   note: '', credit: '' },
      { id: '4', section: 'hardware', img: 'images/004.png', maker: 'MAKER NAME', name: 'Sample accessory', note: '', credit: '' }
    ];

    /* ------------------------------------------------------------
       Everything below builds the page. No need to touch it.
       ------------------------------------------------------------ */

    const $ = function (id) { return document.getElementById(id); };
    const head = $('head'), main = $('main'), statusEl = $('status'), countEl = $('count');
    const q = $('q'), searchEl = $('search'), shuffleBtn = $('shuffle'), sectionBtn = $('by-section');
    const zoom = $('zoom'), zoomImg = $('zoom-img'), zoomMeta = $('zoom-meta'), zoomThumbs = $('zoom-thumbs');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let items = [];         /* every item, in its current random order */
    let bySection = location.hash === '#by-section';
    let order = [];         /* items currently on the page, for PREV / NEXT */
    let openIndex = -1;
    let openPhoto = 0;

    function pad(n) {
      const s = String(n).trim();
      return /^\d+$/.test(s) ? s.padStart(3, '0') : s;
    }

    function el(tagName, className, text) {
      const node = document.createElement(tagName);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function thumbOf(src) {
      return /^images\//.test(src) ? src.replace(/^images\//, 'images/thumbs/') : src;
    }

    /* Load the small copy; fall back to the full photo if there isn't one. */
    function setImg(img, src) {
      img.addEventListener('load', function () { img.classList.add('ready'); });
      img.addEventListener('error', function retry() {
        img.removeEventListener('error', retry);
        if (img.src.indexOf('/thumbs/') !== -1) img.src = src;
      });
      img.src = thumbOf(src);
    }

    function shuffle(list) {
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = list[i]; list[i] = list[j]; list[j] = t;
      }
      return list;
    }

    function sectionName(item) {
      return item.section || 'other';
    }

    /* ---------- reading the sheet ---------- */

    function parseCSV(text) {
      const rows = [];
      let row = [], cell = '', inQuotes = false;
      text = text.replace(/^﻿/, '');
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
          if (c === '"') {
            if (text[i + 1] === '"') { cell += '"'; i++; } else { inQuotes = false; }
          } else {
            cell += c;
          }
        } else if (c === '"') {
          inQuotes = true;
        } else if (c === ',') {
          row.push(cell); cell = '';
        } else if (c === '\n') {
          row.push(cell); rows.push(row); row = []; cell = '';
        } else if (c !== '\r') {
          cell += c;
        }
      }
      if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
      return rows;
    }

    function rowsToItems(rows) {
      if (rows.length < 2) return [];
      const headers = rows[0].map(function (h) { return h.trim().toLowerCase(); });
      return rows.slice(1).map(function (r, n) {
        const item = {};
        headers.forEach(function (h, i) { item[h] = (r[i] || '').trim(); });
        if (!item.id) item.id = String(n + 1);
        item.section = (item.section || '').toLowerCase();
        return item;
      }).filter(function (item) {
        return item.img || item.name;
      }).map(function (item) {
        /* Several photos: list them in the "img" cell, separated by commas
           or line breaks. The first one is the cover. */
        item.imgs = (item.img || '').split(/[\s,]+/).filter(Boolean);
        item.img = item.imgs[0] || '';
        item.text = [item.id, pad(item.id), item.section, item.maker, item.name, item.note].join(' ').toLowerCase();
        return item;
      });
    }

    /* ---------- cards ---------- */

    function makeCard(item) {
      const card = el('button', 'card');
      card.type = 'button';
      const frame = el('div', 'frame');
      const img = document.createElement('img');
      img.alt = [item.maker, item.name].filter(Boolean).join(' ');
      img.loading = 'lazy';
      img.decoding = 'async';
      setImg(img, item.img);
      frame.append(img);
      if (item.imgs.length > 1) frame.append(el('span', 'more', '[+' + (item.imgs.length - 1) + ']'));
      const meta = el('div', 'meta');
      meta.append(
        el('div', '', '[' + pad(item.id) + '] ' + (item.maker || '')),
        el('div', '', item.name || '')
      );
      if (!bySection) meta.append(el('div', 'sec', sectionName(item)));
      card.append(frame, meta);
      card.addEventListener('click', function () { openZoom(order.indexOf(item)); });
      return card;
    }

    /* ---------- drawing the page ---------- */

    function matches(item, words) {
      return words.every(function (w) { return item.text.indexOf(w) !== -1; });
    }

    function render() {
      const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
      searchEl.classList.toggle('has-text', words.length > 0);
      const shown = items.filter(function (item) { return matches(item, words); });

      main.textContent = '';
      order = [];

      if (!items.length) {
        statusEl.textContent = 'No items yet.';
        main.append(statusEl);
        return;
      }

      if (bySection) {
        const keys = SECTIONS.map(function (k) { return String(k).toLowerCase(); });
        const extra = [];
        shown.forEach(function (item) {
          if (keys.indexOf(item.section) === -1 && extra.indexOf(item.section) === -1) extra.push(item.section);
        });
        extra.sort();
        keys.concat(extra).forEach(function (key) {
          const group = shown.filter(function (i) { return i.section === key; });
          if (!group.length) return;
          const section = el('section');
          const headRow = el('div', 'section-head');
          headRow.append(el('span', '', key || 'other'), el('span', '', group.length + (group.length === 1 ? ' item' : ' items')));
          const grid = el('div', 'grid');
          group.forEach(function (item) { order.push(item); grid.append(makeCard(item)); });
          section.append(headRow, grid);
          main.append(section);
        });
      } else {
        const grid = el('div', 'grid');
        shown.forEach(function (item) { order.push(item); grid.append(makeCard(item)); });
        main.append(grid);
      }

      if (words.length) {
        countEl.textContent = shown.length + ' of ' + items.length + ' pieces match “' + q.value.trim() + '”';
      } else {
        countEl.textContent = items.length + ' pieces, in a new order every visit';
      }

      if (!shown.length) {
        statusEl.textContent = 'Nothing matches “' + q.value.trim() + '”';
        main.append(statusEl);
      }
    }

    function fadeRender() {
      if (reduceMotion) { render(); return; }
      main.classList.add('fading');
      setTimeout(function () {
        render();
        main.classList.remove('fading');
      }, 250);
    }

    /* ---------- buttons ---------- */

    shuffleBtn.addEventListener('click', function () {
      shuffle(items);
      fadeRender();
      const top = main.getBoundingClientRect().top + window.scrollY - head.offsetHeight - 20;
      if (window.scrollY > top) window.scrollTo(0, top);
    });

    function setSectionView(on) {
      bySection = on;
      sectionBtn.classList.toggle('on', on);
      sectionBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      if (history.replaceState) history.replaceState(null, '', on ? '#by-section' : location.pathname + location.search);
    }

    sectionBtn.addEventListener('click', function () {
      setSectionView(!bySection);
      fadeRender();
    });

    $('home').addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
    });

    q.addEventListener('input', render);
    q.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { clearSearch(); q.blur(); }
      if (e.key === 'Enter') {
        q.blur();
        if (order.length === 1) openZoom(0);
      }
    });

    function clearSearch() {
      if (!q.value) return;
      q.value = '';
      render();
    }

    $('q-clear').addEventListener('click', function () { clearSearch(); q.focus(); });

    document.addEventListener('keydown', function (e) {
      if (zoom.classList.contains('open') || document.activeElement === q) return;
      if (e.key === '/') { e.preventDefault(); q.focus(); }
    });

    /* ---------- detail view ---------- */

    function openZoom(index) {
      if (!order.length || index < 0) return;
      openIndex = (index + order.length) % order.length;
      const item = order[openIndex];

      zoomThumbs.textContent = '';
      if (item.imgs.length > 1) {
        item.imgs.forEach(function (src, n) {
          const b = document.createElement('button');
          b.type = 'button';
          b.setAttribute('aria-label', 'Photo ' + (n + 1) + ' of ' + item.imgs.length);
          const t = document.createElement('img');
          t.alt = '';
          setImg(t, src);
          b.append(t);
          b.addEventListener('click', function () { showPhoto(n); });
          zoomThumbs.append(b);
        });
      }
      zoomImg.alt = [item.maker, item.name].filter(Boolean).join(' ');
      zoomImg.classList.toggle('multi', item.imgs.length > 1);
      showPhoto(0);

      zoomMeta.textContent = '';
      zoomMeta.append(el('div', 'sec', '[' + pad(item.id) + '] ' + sectionName(item)));
      zoomMeta.append(el('div', '', [item.maker, item.name].filter(Boolean).join(' // ')));
      if (item.note) zoomMeta.append(el('div', '', item.note));
      if (item.credit) zoomMeta.append(el('div', 'sec', 'Photo: ' + item.credit));

      if (!zoom.classList.contains('open')) {
        zoom.classList.add('open');
        document.body.style.overflow = 'hidden';
        $('zoom-close').focus({ preventScroll: true });
      }
    }

    function showPhoto(n) {
      const item = order[openIndex];
      if (!item || !item.imgs.length) return;
      openPhoto = (n + item.imgs.length) % item.imgs.length;
      zoomImg.src = item.imgs[openPhoto];
      Array.prototype.forEach.call(zoomThumbs.children, function (b, i) {
        b.classList.toggle('active', i === openPhoto);
      });
    }

    /* Step through this item's photos, then on to the next item. */
    function stepPhoto(dir) {
      const item = order[openIndex];
      const next = openPhoto + dir;
      if (item && next >= 0 && next < item.imgs.length) { showPhoto(next); return; }
      openZoom(openIndex + dir);
      if (dir < 0) {
        const prev = order[openIndex];
        if (prev && prev.imgs.length > 1) showPhoto(prev.imgs.length - 1);
      }
    }

    function closeZoom() {
      zoom.classList.remove('open');
      document.body.style.overflow = '';
      const cards = main.querySelectorAll('.card');
      const card = cards[openIndex];
      if (card) card.focus({ preventScroll: true });
    }

    $('zoom-close').addEventListener('click', closeZoom);
    $('zoom-prev').addEventListener('click', function () { openZoom(openIndex - 1); });
    $('zoom-next').addEventListener('click', function () { openZoom(openIndex + 1); });
    zoomImg.addEventListener('click', function () { if (!swiped) showPhoto(openPhoto + 1); });

    zoom.addEventListener('click', function (e) {
      if (e.target === zoom) closeZoom();
    });

    /* Swipe left / right on phones */
    let swipe = null, swiped = false;
    zoom.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) { swipe = null; return; }
      swipe = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      swiped = false;
    }, { passive: true });
    zoom.addEventListener('touchend', function (e) {
      if (!swipe) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - swipe.x, dy = t.clientY - swipe.y;
      swipe = null;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        swiped = true;
        setTimeout(function () { swiped = false; }, 400);
        stepPhoto(dx < 0 ? 1 : -1);
      }
    });

    document.addEventListener('keydown', function (e) {
      if (!zoom.classList.contains('open')) return;
      if (e.key === 'Escape') closeZoom();
      if (e.key === 'ArrowLeft') openZoom(openIndex - 1);
      if (e.key === 'ArrowRight') openZoom(openIndex + 1);
      if (e.key === 'ArrowDown') { e.preventDefault(); showPhoto(openPhoto + 1); }
      if (e.key === 'ArrowUp') { e.preventDefault(); showPhoto(openPhoto - 1); }
    });

    /* ---------- start ---------- */

    setSectionView(bySection);

    function start(list) {
      items = shuffle(list);
      render();
    }

    if (!SHEET_URL) {
      start(rowsToItems([['id', 'section', 'img', 'maker', 'name', 'note', 'credit']].concat(
        SAMPLE_ITEMS.map(function (i) { return [i.id, i.section, i.img, i.maker, i.name, i.note, i.credit]; }))));
    } else {
      const sep = SHEET_URL.indexOf('?') === -1 ? '?' : '&';
      fetch(SHEET_URL + sep + 't=' + Date.now())
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.text();
        })
        .then(function (text) {
          start(rowsToItems(parseCSV(text)));
        })
        .catch(function () {
          statusEl.textContent = 'Archive unavailable right now. Please try again in a moment.';
        });
    }
  </script>
</body>
</html>
