  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow-x: hidden;
      background: #fff;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      display: block;
      padding: 40px 0 60px;
    }

    /* The whole design lives in this fixed-size stage.
       The script zooms it to fit the window, so proportions never change. */
    #stage {
      width: 1750px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #stage.narrow {
      width: 740px;
      padding: 0 20px;
    }

    #stage.narrow .reel {
      display: none;
    }

    /* POSTER */
    .poster-wrap {
      position: relative;
      width: 700px;
      --player-top: 52%;
    }

    .poster {
      display: block;
      width: 100%;
      height: auto;
      min-height: 300px;
      background: #f2f2f2;
    }

    /* CUSTOM PLAYER */
    .player {
      position: absolute;
      top: var(--player-top);
      left: 50%;
      transform: translate(-50%, -50%);
      width: 68%;
      height: 190px;
      max-height: 190px;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      z-index: 5;
      padding: 6px 16px;
      background: #fff;
      border: 3px solid #000;
      border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
      filter: url(#hand);
      font-family: "Patrick Hand", "Comic Sans MS", cursive, sans-serif;
      color: #000;
      scrollbar-width: thin;
      scrollbar-color: #000 transparent;
    }

    .tracks {
      list-style: none;
      height: auto;
    }

      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
