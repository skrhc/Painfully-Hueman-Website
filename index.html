<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PH VOL. 1</title>
  <meta property="og:title" content="Painfully Hueman Vol. 1">
  <meta property="og:description" content="Sunday Oct. 11 @ Honey's, Brooklyn. Listen to the DJs and RSVP.">
  <meta property="og:image" content="https://painfullyhueman.com/share.jpg">
  <meta property="og:url" content="https://painfullyhueman.com">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow-x: hidden;
      background: #fff;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      zoom: 0.75;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 40px 60px;
    }

    /* POSTER (fixed size so everything stays in proportion) */
    .poster-wrap {
      position: relative;
      width: 700px;
      --player-top: 52%;
    }

    .poster {
      display: block;
      width: 100%;
      height: auto;
      min-height: 300px;
      background: #f2f2f2;
    }

    /* CUSTOM PLAYER */
    .player {
      position: absolute;
      top: var(--player-top);
      left: 50%;
      transform: translate(-50%, -50%);
      width: 68%;
      height: 190px;
      max-height: 190px;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      z-index: 5;
      padding: 6px 16px;
      background: #fff;
      border: 3px solid #000;
      border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
      filter: url(#hand);
      font-family: "Patrick Hand", "Comic Sans MS", cursive, sans-serif;
      color: #000;
      scrollbar-width: thin;
      scrollbar-color: #000 transparent;
    }

    .tracks {
      list-style: none;
      height: auto;
    }

    .track {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 2px;
      font-size: 20px;
      line-height: 1.1;
      cursor: pointer;
      border-bottom: 2px solid #000;
    }

    .track:last-child {
      border-bottom: none;
    }

    .track:hover .name {
      text-decoration: underline;
    }

    .icon {
      width: 22px;
      height: 22px;
      flex: none;
      display: block;
    }

    .icon svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .time {
      flex: none;
      font-size: 18px;
    }

    .bar {
      position: absolute;
      left: 0;
      bottom: -2px;
      height: 6px;
      width: 0;
      background: #000;
    }

    .knob {
      display: none;
      position: absolute;
      left: 0;
      bottom: -7px;
      width: 14px;
      height: 14px;
      margin-left: -7px;
      border-radius: 50%;
      background: #000;
      pointer-events: none;
    }

    .scrub {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      bottom: -10px;
      height: 20px;
      z-index: 2;
      cursor: pointer;
      touch-action: none;
    }

    .track.active .knob,
    .track.active .scrub {
      display: block;
    }

    .track.active .name {
      font-weight: 700;
      text-decoration: underline;
    }

    .loading {
      font-size: 20px;
      padding: 10px 2px;
    }

    /* HIDDEN SOUNDCLOUD PLAYER */
    .sc-hidden {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      border: 0;
    }

    /* SPINNING LOGO REELS (desktop layout is now the only layout) */
    .reel {
      position: absolute;
      top: var(--player-top);
      width: 75%;
      margin-top: -37.5%;
      aspect-ratio: 1;
      border-radius: 50%;
      z-index: 5;
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    .reel-left {
      left: -75%;
    }

    .reel-right {
      right: -75%;
    }

    .poster,
    .rsvp {
      filter: url(#hand);
    }

    /* RSVP */
    .rsvp {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 700px;
      min-height: 96px;
      margin-top: 24px;
      background: #000;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.02em;
      transition: opacity 0.15s ease;
    }

    .rsvp:hover {
      opacity: 0.85;
    }

    @media (prefers-reduced-motion: no-preference) {
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.25); }
      }

      .track.active .icon {
        animation: pulse 1s ease-in-out infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .reel {
        animation: spin 30s linear infinite;
        animation-play-state: paused;
      }

      .poster-wrap.playing .reel {
        animation-play-state: running;
      }
    }
  </style>
</head>

<body>
  <!-- HAND-DRAWN WOBBLE FILTER -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="hand" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence
        id="noise"
        type="fractalNoise"
        baseFrequency="0.035"
        numOctaves="2"
        seed="4"
        result="noise"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="noise"
        scale="3"
        xChannelSelector="R"
        yChannelSelector="G"
      />
    </filter>
  </svg>

  <main>
    <div class="poster-wrap">
      <img
        class="poster"
        src="pH vol. 1 party flyer blank middle.jpg"
        alt="Party poster"
      >

      <!-- CUSTOM PLAYLIST -->
      <div class="player">
        <ul class="tracks" id="tracks">
          <li class="loading">loading...</li>
        </ul>
      </div>

      <!-- SPINNING LOGO REELS -->
      <img
        class="reel reel-left"
        src="Amalga Painfully Hueman Logo.png"
        alt=""
      >

      <img
        class="reel reel-right"
        src="Amalga Painfully Hueman Logo.png"
        alt=""
      >

      <!-- HIDDEN SOUNDCLOUD PLAYER -->
      <iframe
        id="sc"
        class="sc-hidden"
        allow="autoplay; encrypted-media"
        src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/soundcloud%253Aplaylists%253A2306233560&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false"
      ></iframe>
    </div>

    <a
      class="rsvp"
      href="https://luma.com/mdbnchv5"
      target="_blank"
      rel="noopener"
    >**GET TIX HERE**</a>
  </main>

  <script src="https://w.soundcloud.com/player/api.js"></script>

  <script>
    const widget = SC.Widget('sc');
    const list = document.getElementById('tracks');
    const wrap = document.querySelector('.poster-wrap');

    const PLAY_ICON =
      '<svg viewBox="0 0 24 24"><path d="M5.5 3.4 L19.4 11.4 L4.8 20.9 Z" fill="#000" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg>';

    const PAUSE_ICON =
      '<svg viewBox="0 0 24 24"><path d="M5.6 3.6 L9.8 3.2 L9.2 20.6 L5.2 20.2 Z M14.4 3.8 L18.6 4.3 L18.2 20.4 L14.0 20.8 Z" fill="#000" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/></svg>';

    let sounds = [];
    let current = -1;
    let playing = false;
    let dragging = false;
    let loadingDetails = false;
    let loadToken = 0;

    function fmt(ms) {
      if (!Number.isFinite(ms) || ms <= 0) return '';

      const seconds = Math.round(ms / 1000);
      const minutes = Math.floor(seconds / 60);
      const remainder = String(seconds % 60).padStart(2, '0');

      return minutes + ':' + remainder;
    }

    function clamp01(value) {
      return Math.max(0, Math.min(1, value));
    }

    function render() {
      list.innerHTML = '';

      sounds.forEach((sound, index) => {
        const li = document.createElement('li');
        li.className = 'track';

        const icon = document.createElement('span');
        icon.className = 'icon';
        icon.innerHTML = PLAY_ICON;

        const name = document.createElement('span');
        name.className = 'name';

        // Prevent a missing SoundCloud title from creating a blank row.
        name.textContent =
          sound.title && sound.title.trim()
            ? sound.title
            : index === 5
              ? 'BOYGIRL'
              : 'Track ' + (index + 1);

        const time = document.createElement('span');
        time.className = 'time';
        time.textContent =
          Number(sound.duration) > 0
            ? fmt(Number(sound.duration))
            : index === 5
              ? '6:36'
              : '';

        const bar = document.createElement('span');
        bar.className = 'bar';

        const knob = document.createElement('span');
        knob.className = 'knob';

        const scrub = document.createElement('span');
        scrub.className = 'scrub';

        li.append(icon, name, time, bar, knob, scrub);

        li.addEventListener('click', () => choose(index));
        attachScrub(li, index);

        list.appendChild(li);
      });

      paint();
    }

    function setProgress(li, fraction) {
      fraction = clamp01(fraction);

      li.querySelector('.bar').style.width =
        (fraction * 100) + '%';

      li.querySelector('.knob').style.left =
        (fraction * 100) + '%';
    }

    function attachScrub(li, index) {
      const scrub = li.querySelector('.scrub');

      function fractionFromEvent(event) {
        const rect = li.getBoundingClientRect();
        return clamp01((event.clientX - rect.left) / rect.width);
      }

      scrub.addEventListener('click', event => {
        event.stopPropagation();
      });

      scrub.addEventListener('pointerdown', event => {
        if (index !== current) return;

        event.preventDefault();
        event.stopPropagation();

        dragging = true;
        scrub.setPointerCapture(event.pointerId);
        setProgress(li, fractionFromEvent(event));
      });

      scrub.addEventListener('pointermove', event => {
        if (dragging) {
          setProgress(li, fractionFromEvent(event));
        }
      });

      scrub.addEventListener('pointerup', event => {
        if (!dragging) return;

        dragging = false;

        const fraction = fractionFromEvent(event);
        setProgress(li, fraction);

        widget.getDuration(duration => {
          const trackDuration =
            duration ||
            (sounds[current] && sounds[current].duration) ||
            0;

          if (trackDuration) {
            widget.seekTo(fraction * trackDuration);
          }
        });
      });

      scrub.addEventListener('pointercancel', () => {
        dragging = false;
      });
    }

    function choose(index) {
      if (index === current) {
        widget.toggle();
      } else {
        widget.skip(index);
        widget.play();
      }
    }

    function paint() {
      Array.from(list.children).forEach((li, index) => {
        const active = index === current;

        li.classList.toggle('active', active);

        li.querySelector('.icon').innerHTML =
          active && playing ? PAUSE_ICON : PLAY_ICON;

        if (!active) {
          setProgress(li, 0);
        }
      });
    }

    function sync() {
      widget.getCurrentSoundIndex(index => {
        current = Number.isInteger(index) ? index : -1;
        paint();
      });
    }

    /*
      Load playlist metadata directly from SoundCloud.
      Individual-track lookups are attempted when playlist
      metadata is incomplete. Missing titles get a fallback.
    */
    function loadTrackDetails() {
      if (loadingDetails || playing || sounds.length === 0) return;

      loadingDetails = true;
      const thisLoad = ++loadToken;

      widget.getCurrentSoundIndex(originalIndex => {
        if (thisLoad !== loadToken) {
          loadingDetails = false;
          return;
        }

        let index = 0;

        function nextTrack() {
          if (thisLoad !== loadToken) {
            loadingDetails = false;
            return;
          }

          if (index >= sounds.length) {
            const restoreIndex =
              Number.isInteger(originalIndex) && originalIndex >= 0
                ? originalIndex
                : 0;

            widget.skip(restoreIndex);
            current = restoreIndex;
            loadingDetails = false;
            render();
            return;
          }

          const trackIndex = index++;

          widget.skip(trackIndex);

          // Give SoundCloud time to switch to the selected track.
          setTimeout(() => {
            if (thisLoad !== loadToken) {
              loadingDetails = false;
              return;
            }

            widget.getCurrentSound(sound => {
              if (thisLoad !== loadToken) {
                loadingDetails = false;
                return;
              }

              if (sound) {
                const existing = sounds[trackIndex] || {};

                sounds[trackIndex] = {
                  ...existing,
                  ...sound,
                  title:
                    sound.title || existing.title || '',
                  duration:
                    Number(sound.duration) ||
                    Number(existing.duration) ||
                    0
                };
              }

              render();
              nextTrack();
            });
          }, 350);
        }

        nextTrack();
      });
    }

    function loadPlaylist() {
      widget.getSounds(result => {
        if (!Array.isArray(result) || result.length === 0) {
          list.innerHTML =
            '<li class="loading">Playlist unavailable</li>';
          return;
        }

        sounds = result.map(sound => ({
          ...sound,
          title: sound.title || '',
          duration: Number(sound.duration) || 0
        }));

        render();
        sync();

        const hasMissingMetadata = sounds.some(sound =>
          !sound.title || !sound.duration
        );

        if (hasMissingMetadata) {
          loadTrackDetails();
        }
      });
    }

    widget.bind(SC.Widget.Events.READY, loadPlaylist);

    widget.bind(SC.Widget.Events.PLAY, () => {
      playing = true;
      loadToken++;
      loadingDetails = false;
      wrap.classList.add('playing');
      sync();
    });

    widget.bind(SC.Widget.Events.PAUSE, () => {
      playing = false;
      wrap.classList.remove('playing');
      paint();
    });

    widget.bind(SC.Widget.Events.FINISH, () => {
      playing = false;
      wrap.classList.remove('playing');
      sync();
    });

    widget.bind(SC.Widget.Events.PLAY_PROGRESS, event => {
      if (dragging) return;

      const li = list.children[current];

      if (li) {
        setProgress(li, event.relativePosition);
      }
    });

    /* Subtle hand-drawn animation */
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const noise = document.getElementById('noise');
      let seed = 0;

      setInterval(() => {
        seed = (seed % 6) + 1;
        noise.setAttribute('seed', seed);
      }, 150);
    }
  </script>
</body>
</html>
