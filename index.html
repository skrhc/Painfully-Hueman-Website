<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PARTY</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #ffffff;
      color: #000000;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
    }

    /* POSTER + PLAYER */
    .poster-wrap {
      position: relative;
      width: min(700px, 100%);
    }

    .poster {
      display: block;
      width: 100%;
      height: auto;
      min-height: 300px;
      background: #f2f2f2; /* shows until the real poster is added */
    }

    .soundcloud-player {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 88%;
      z-index: 5;
      background: #ffffff;
      border: 1px solid #000000;
    }

    .soundcloud-player iframe {
      display: block;
      width: 100%;
      border: 0;
    }

    /* RSVP BUTTON */
    .rsvp {
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(700px, 100%);
      min-height: 96px;
      margin-top: 24px;
      background: #000000;
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.02em;
      transition: opacity 0.15s ease;
    }

    .rsvp:hover { opacity: 0.85; }

    @media (max-width: 600px) {
      main { padding: 16px 12px 40px; }
      .soundcloud-player { top: 12px; width: 92%; }
      .rsvp { min-height: 80px; font-size: 26px; }
    }
  </style>
</head>

<body>
  <main>

    <div class="poster-wrap">

      <!-- 1. REPLACE with your poster image (file name or URL) -->
      <img
        class="poster"
        src="YOUR-POSTER-IMAGE.jpg"
        alt="Party poster"
      >

      <!-- PLAYLIST: PAINFULLY HUEMAN VOL. 1 -->
      <div class="soundcloud-player">
        <iframe
          width="100%"
          height="166"
          scrolling="no"
          frameborder="no"
          allow="autoplay; encrypted-media"
          src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/soundcloud%253Aplaylists%253A2306233560&color=%23000000&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false">
        </iframe>
      </div>

    </div>

    <!-- 2. REPLACE with your RSVP link -->
    <a class="rsvp" href="YOUR-RSVP-LINK" target="_blank" rel="noopener">
      RSVP NEOW!
    </a>

  </main>
</body>
</html>
