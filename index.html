<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PARTY</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #ffffff;
      color: #000000;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
    }

    /* POSTER + PLAYER */
    .poster-wrap {
      position: relative;
      width: min(700px, 100%);
    }

    .poster {
      display: block;
      width: 100%;
      height: auto;
      min-height: 300px;
      background: #f2f2f2;
    }

    /* STANDARD SOUNDCLOUD PLAYER, black + white and wobbly/hand-drawn */
    .soundcloud-player {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 88%;
      z-index: 5;
      background: #fff;
      border: 3px solid #000;
      border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; /* hand-drawn box corners */
      overflow: hidden;
      filter: grayscale(1) contrast(1.35) url(#hand);
    }

    .soundcloud-player iframe {
      display: block;
      width: 100%;
      height: 300px; /* use 166 for a compact bar */
      border: 0;
    }

    /* RSVP BUTTON */
    .rsvp {
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(700px, 100%);
      min-height: 96px;
      margin-top: 24px;
      background: #000000;
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.02em;
      transition: opacity 0.15s ease;
    }
    .rsvp:hover { opacity: 0.85; }

    @media (max-width: 600px) {
      main { padding: 16px 12px 40px; }
      .soundcloud-player { width: 92%; }
      .soundcloud-player iframe { height: 166px; }
      .rsvp { min-height: 80px; font-size: 26px; }
    }
  </style>
</head>

<body>

  <!-- the "hand-drawn wobble" filter (invisible) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="hand" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <main>

    <div class="poster-wrap">

      <!-- POSTER (file must sit in the same folder as this index.html) -->
      <img
        class="poster"
        src="pH vol. 1 party flyer blank middle.jpg"
        alt="Party poster"
      >

      <!-- PLAYLIST: PAINFULLY HUEMAN VOL. 1 -->
      <div class="soundcloud-player">
        <iframe
          width="100%"
          height="300"
          scrolling="no"
          frameborder="no"
          allow="autoplay; encrypted-media"
          src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/soundcloud%253Aplaylists%253A2306233560&color=%23000000&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false">
        </iframe>
      </div>

    </div>

    <!-- RSVP -->
    <a class="rsvp" href="https://partiful.com/e/C60TCIZeHIw9OBnTJ1kL" target="_blank" rel="noopener">
      RSVP NEOW!
    </a>

  </main>
</body>
</html>
