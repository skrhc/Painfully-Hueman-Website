<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PH VOL. 1</title>
  <meta property="og:title" content="Painfully Hueman Vol. 1">
  <meta property="og:description" content="Sunday Oct. 11 @ Honey's, Brooklyn. Listen to the DJs and RSVP.">
  <meta property="og:image" content="https://painfullyhueman.com/share.jpg">
  <meta property="og:url" content="https://painfullyhueman.com">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow-x: hidden;
      background: #fff;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
    }

    /* POSTER + PLAYER */
    .poster-wrap {
      position: relative;
      width: min(35vw, 700px);
      --player-top: 52%;
    }

    .poster {
      display: block;
      width: 100%;
      height: auto;
      min-height: 300px;
      background: #f2f2f2;
    }

    /* FIXED-HEIGHT, SCROLLABLE PLAYLIST */
    .player {
      position: absolute;
      top: var(--player-top);
      left: 50%;
      transform: translate(-50%, -50%);
      width: 68%;
      height: 190px;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      z-index: 5;
      padding: 6px 16px;
      background: #fff;
      border: 3px solid #000;
      border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
      filter: url(#hand);
      font-family: "Patrick Hand", "Comic Sans MS", cursive, sans-serif;
      color: #000;
      scrollbar-width: thin;
      scrollbar-color: #000 transparent;
    }

    .player::-webkit-scrollbar {
      width: 5px;
    }

    .player::-webkit-scrollbar-track {
      background: transparent;
    }

    .player::-webkit-scrollbar-thumb {
      background: #000;
      border-radius: 5px;
    }

    .tracks {
      list-style: none;
      height: auto;
    }

    .track {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 2px;
      font-size: 20px;
      line-height: 1.1;
      cursor: pointer;
      border-bottom: 2px solid #000;
    }

    .track:last-child {
      border-bottom: none;
    }

    .track:hover .name {
      text-decoration: underline;
    }

    .icon {
      width: 22px;
      height: 22px;
      flex: none;
      display: block;
    }

    .icon svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .time {
      flex: none;
      font-size: 18px;
    }

    /* TRACK PROGRESS */
    .bar {
      position: absolute;
      left: 0;
      bottom: -2px;
      height: 6px;
      width: 0;
      background: #000;
      pointer-events: none;
    }

    .track.active .name {
      font-weight: 700;
      text-decoration: underline;
    }

    .loading {
      font-size: 20px;
      padding: 10px 2px;
    }

    /* HIDDEN SOUNDCLOUD PLAYER */
    .sc-hidden {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      border: 0;
    }

    /* SPINNING LOGO REELS */
    .reel {
      position: absolute;
      top: var(--player-top);
      width: 14%;
      margin-top: -7%;
      aspect-ratio: 1;
      border-radius: 50%;
      z-index: 5;
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    .reel-left {
      left: 1%;
    }

    .reel-right {
      right: 1%;
    }

    /* LARGE DESKTOP REELS */
    @media (min-width: 901px) {
      .reel {
        width: 75%;
        margin-top: -37.5%;
      }

      .reel-left {
        left: -75%;
      }

      .reel-right {
        right: -75%;
      }
    }

    /* HAND-DRAWN EFFECT */
    .poster,
    .rsvp {
      filter: url(#hand);
    }

    /* RSVP BUTTON */
    .rsvp {
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(35vw, 700px);
      min-height: 96px;
      margin-top: 24px;
      background: #000;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.02em;
      transition: opacity 0.15s ease;
    }

    .rsvp:hover {
      opacity: 0.85;
    }

    /* ANIMATIONS */
    @media (prefers-reduced-motion: no-preference) {
      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.25);
        }
      }

      .track.active .icon {
        animation: pulse 1s ease-in-out infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .reel {
        animation: spin 30s linear infinite;
        animation-play-state: paused;
      }

      .poster-wrap.playing .reel {
        animation-play-state: running;
      }
    }

    /* TABLETS AND SMALLER SCREENS */
    @media (max-width: 900px) {
      .reel {
        display: none;
      }

      .poster-wrap {
        width: min(700px, 100%);
      }

      .rsvp {
        width: min(700px, 100%);
      }

      .player {
        width: 84%;
      }
    }

    /* MOBILE */
    @media (max-width: 600px) {
      main {
        padding: 16px 12px 40px;
      }

      .player {
        width: 84%;
        height: 145px;
        max-height: none;
        padding: 4px 12px;
        overflow-y: auto;
      }

      .track {
        font-size: 18px;
        padding: 6px 2px;
        gap: 8px;
      }

      .icon {
        width: 18px;
        height: 18px;
      }

      .time {
        font-size: 15px;
      }

      .rsvp {
        min-height: 80px;
        font-size: 26px;
        margin-top: 44px;
      }
    }
  </style>
</head>

<body>

  <!-- HAND-DRAWN WOBBLE FILTER -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="hand" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence
        id="noise"
        type="fractalNoise"
        baseFrequency="0.035"
        numOctaves="2"
        seed="4"
        result="noise"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="noise"
        scale="3"
        xChannelSelector="R"
        yChannelSelector="G"
      />
    </filter>
  </svg>

  <main>

    <div class="poster-wrap">

      <!-- POSTER -->
      <img
        class="poster"
        src="pH vol. 1 party flyer blank middle.jpg"
        alt="Party poster"
      >

      <!-- CUSTOM PLAYLIST -->
      <div class="player">
        <ul class="tracks" id="tracks">
          <li class="loading">loading...</li>
        </ul>
      </div>

      <!-- SPINNING LOGO REELS -->
      <img
        class="reel reel-left"
        src="Amalga Painfully Hueman Logo.png"
        alt=""
      >

      <img
        class="reel reel-right"
        src="Amalga Painfully Hueman Logo.png"
        alt=""
      >

      <!-- HIDDEN SOUNDCLOUD PLAYER -->
      <iframe
        id="sc"
        class="sc-hidden"
        allow="autoplay; encrypted-media"
        src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/soundcloud%253Aplaylists%253A2306233560&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false">
      </iframe>

    </div>

    <!-- RSVP -->
    <a
      class="rsvp"
      href="https://partiful.com/e/C60TCIZeHIw9OBnTJ1kL"
      target="_blank"
      rel="noopener"
    >RSVP NEOW!</a>

  </main>

  <script src="https://w.soundcloud.com/player/api.js"></script>

  <script>
    const widget = SC.Widget('sc');
    const list = document.getElementById('tracks');
    const wrap = document.querySelector('.poster-wrap');

    // HAND-DRAWN PLAY AND PAUSE ICONS
    const PLAY_ICON =
      '<svg viewBox="0 0 24 24"><path d="M5.5 3.4 L19.4 11.4 L4.8 20.9 Z" fill="#000" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg>';

    const PAUSE_ICON =
      '<svg viewBox="0 0 24 24"><path d="M5.6 3.6 L9.8 3.2 L9.2 20.6 L5.2 20.2 Z M14.4 3.8 L18.6 4.3 L18.2 20.4 L14.0 20.8 Z" fill="#000" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/></svg>';

    let sounds = [];
    let current = -1;
    let playing = false;

    function fmt(ms) {
      const s = Math.round(ms / 1000);
      return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    }

    function render() {
      list.innerHTML = '';

      sounds.forEach((s, i) => {
        const li = document.createElement('li');
        li.className = 'track';

        li.innerHTML =
          '<span class="icon"></span>' +
          '<span class="name"></span>' +
          '<span class="time"></span>' +
          '<span class="bar"></span>';

        li.querySelector('.icon').innerHTML = PLAY_ICON;

        li.querySelector('.name').textContent =
          s.title || s.user?.username || 'Untitled track';

        li.querySelector('.time').textContent =
          Number.isFinite(s.duration) && s.duration > 0
            ? fmt(s.duration)
            : '';

        li.addEventListener('click', () => choose(i));

        list.appendChild(li);
      });
    }

    function choose(i) {
      if (i === current) {
        widget.toggle();
      } else {
        widget.skip(i);
        widget.play();
      }
    }

    function paint() {
      Array.from(list.children).forEach((li, i) => {
        const active = i === current;

        li.classList.toggle('active', active);

        li.querySelector('.icon').innerHTML =
          (active && playing) ? PAUSE_ICON : PLAY_ICON;

        if (!active) {
          li.querySelector('.bar').style.width = '0';
        }
      });
    }

    function sync() {
      widget.getCurrentSoundIndex(i => {
        current = i;
        paint();
      });
    }

    widget.bind(SC.Widget.Events.READY, () => {
      widget.getSounds(s => {
        sounds = s;
        render();
        sync();
      });
    });

    widget.bind(SC.Widget.Events.PLAY, () => {
      playing = true;
      wrap.classList.add('playing');
      sync();
    });

    widget.bind(SC.Widget.Events.PAUSE, () => {
      playing = false;
      wrap.classList.remove('playing');
      paint();
    });

    widget.bind(SC.Widget.Events.PLAY_PROGRESS, e => {
      const li = list.children[current];

      if (li && li.querySelector('.bar')) {
        li.querySelector('.bar').style.width =
          (e.relativePosition * 100) + '%';
      }
    });

    // HAND-DRAWN LINE ANIMATION
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const noise = document.getElementById('noise');
      let n = 0;

      setInterval(() => {
        n = (n % 6) + 1;
        noise.setAttribute('seed', n);
      }, 150);
    }
  </script>

</body>
</html>
