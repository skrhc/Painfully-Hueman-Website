  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      overflow-x: hidden;
    }

    body {
      background: #fff;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* The whole page is laid out at a fixed size,
       then scaled as one unit by the script at the bottom. */
    main {
      width: 2000px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 0 60px;
      transform-origin: top left;
    }

    /* POSTER */
    .poster-wrap {
      position: relative;
      width: 700px;
      --player-top: 52%;
    }

    .poster {
      display: block;
      width: 100%;
      height: auto;
      min-height: 300px;
      background: #f2f2f2;
    }

    /* CUSTOM PLAYER */
    .player {
      position: absolute;
      top: var(--player-top);
      left: 50%;
      transform: translate(-50%, -50%);
      width: 68%;
      height: 190px;
      max-height: 190px;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      z-index: 5;
      padding: 6px 16px;
      background: #fff;
      border: 3px solid #000;
      border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
      filter: url(#hand);
      font-family: "Patrick Hand", "Comic Sans MS", cursive, sans-serif;
      color: #000;
      scrollbar-width: thin;
      scrollbar-color: #000 transparent;
    }

    .tracks {
      list-style: none;
      height: auto;
    }

    .track {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 2px;
      font-size: 20px;
      line-height: 1.1;
      cursor: pointer;
      border-bottom: 2px solid #000;
    }

    .track:last-child {
      border-bottom: none;
    }

    .track:hover .name {
      text-decoration: underline;
    }

    .icon {
      width: 22px;
      height: 22px;
      flex: none;
      display: block;
    }

    .icon svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .time {
      flex: none;
      font-size: 18px;
    }

    .bar {
      position: absolute;
      left: 0;
      bottom: -2px;
      height: 6px;
      width: 0;
      background: #000;
    }
