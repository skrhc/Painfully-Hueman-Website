<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PH VOL. 1</title>
  <meta property="og:title" content="Painfully Hueman Vol. 1">
  <meta property="og:description" content="Sunday Oct. 11 @ Honey's, Brooklyn. Listen to the DJs and RSVP.">
  <meta property="og:image" content="https://painfullyhueman.com/share.jpg">
  <meta property="og:url" content="https://painfullyhueman.com">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow-x: hidden;
      background: #fff;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(20px, 3vw, 40px) 3vw 60px;
    }

    /* POSTER + PLAYER */
    .poster-wrap {
      position: relative;
      width: min(52vw, 700px);
      --player-top: 52%;
    }

    .poster {
      display: block;
      width: 100%;
      height: auto;
      min-height: 300px;
      background: #f2f2f2;
    }

    /* CUSTOM PLAYER */
    .player {
      position: absolute;
      top: var(--player-top);
      left: 50%;
      transform: translate(-50%, -50%);
      width: 68%;
      max-height: 300px;
      overflow-y: auto;
      z-index: 5;
      padding: 6px 16px;
      background: #fff;
      border: 3px solid #000;
      border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
      filter: url(#hand);
      font-family: "Patrick Hand", "Comic Sans MS", cursive, sans-serif;
      color: #000;
      scrollbar-width: none;
    }

    .player::-webkit-scrollbar {
      display: none;
    }

    .tracks {
      list-style: none;
    }

    .track {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 2px;
      font-size: 22px;
      line-height: 1.1;
      cursor: pointer;
      border-bottom: 2px solid #000;
    }

    .track:last-child {
      border-bottom: none;
    }

    .track:hover .name {
      text-decoration: underline;
    }

    .icon {
      width: 22px;
      height: 22px;
      flex: none;
      display: block;
    }

    .icon svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .time {
      flex: none;
      font-size: 18px;
    }

    .bar {
      position: absolute;
      left: 0;
      bottom: -2px;
      height: 6px;
      width: 0;
      background: #000;
    }

    .knob {
      display: none;
      position: absolute;
      left: 0;
      bottom: -7px;
      width: 14px;
      height: 14px;
      margin-left: -7px;
      border-radius: 50%;
      background: #000;
      pointer-events: none;
    }

    .scrub {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      bottom: -10px;
      height: 20px;
      z-index: 2;
      cursor: pointer;
      touch-action: none;
    }

    .track.active .knob,
    .track.active .scrub {
      display: block;
    }

    .track.active .name {
      font-weight: 700;
      text-decoration: underline;
    }

    .loading {
      font-size: 20px;
      padding: 10px 2px;
    }

    /* HIDDEN SOUNDCLOUD ENGINE */
    .sc-hidden {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      border: 0;
    }

    /* SPINNING LOGO REELS */
    .reel {
      position: absolute;
      top: var(--player-top);
      width: 14%;
      margin-top: -7%;
      aspect-ratio: 1;
      border-radius: 50%;
      z-index: 5;
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    .reel-left {
      left: 1%;
    }

    .reel-right {
      right: 1%;
    }

    /* LARGE DESKTOP DECORATIVE REELS */
    @media (min-width: 901px) {
      .reel {
        width: 75%;
        margin-top: -37.5%;
      }

      .reel-left {
        left: -75%;
      }

      .reel-right {
        right: -75%;
      }
    }

    .poster,
    .rsvp {
      filter: url(#hand);
    }

    /* RSVP BUTTON */
    .rsvp {
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(52vw, 700px);
      min-height: clamp(64px, 6.5vw, 96px);
      margin-top: 24px;
      background: #000;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-size: clamp(22px, 2.25vw, 34px);
      font-weight: 700;
      letter-spacing: -0.02em;
      transition: opacity 0.15s ease;
    }

    .rsvp:hover {
      opacity: 0.85;
    }

    @media (prefers-reduced-motion: no-preference) {
      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.25);
        }
      }

      .track.active .icon {
        animation: pulse 1s ease-in-out infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .reel {
        animation: spin 30s linear infinite;
        animation-play-state: paused;
      }

      .poster-wrap.playing .reel {
        animation-play-state: running;
      }
    }

    /* TABLETS AND SMALLER SCREENS */
    @media (max-width: 900px) {
      main {
        padding: 24px 20px 48px;
      }

      .poster-wrap {
        width: min(700px, 100%);
      }

      .rsvp {
        width: min(700px, 100%);
      }

      .reel {
        display: none;
      }

      .player {
        width: 84%;
      }
    }

    /* MOBILE */
    @media (max-width: 600px) {
      main {
        padding: 16px 12px 40px;
      }

      .player {
        width: 84%;
        max-height: 145px;
        padding: 4px 12px;
      }

      .track {
        font-size: 18px;
        padding: 6px 2px;
        gap: 8px;
      }

      .icon {
        width: 18px;
        height: 18px;
      }

      .time {
        font-size: 15px;
      }

      .rsvp {
        min-height: 80px;
        font-size: 26px;
        margin-top: 44px;
      }
    }
  </style>
</head>

<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="hand" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence
        id="noise"
        type="fractalNoise"
        baseFrequency="0.035"
        numOctaves="2"
        seed="4"
        result="noise"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="noise"
        scale="3"
        xChannelSelector="R"
        yChannelSelector="G"
      />
    </filter>
  </svg>

  <main>
    <div class="poster-wrap">
      <img
        class="poster"
        src="pH vol. 1 party flyer blank middle.jpg"
        alt="Party poster"
      >

      <div class="player">
        <ul class="tracks" id="tracks">
          <li class="loading">loading...</li>
        </ul>
      </div>

      <img
        class="reel reel-left"
        src="Amalga Painfully Hueman Logo.png"
        alt=""
      >

      <img
        class="reel reel-right"
        src="Amalga Painfully Hueman Logo.png"
        alt=""
      >

      <iframe
        id="sc"
        class="sc-hidden"
        allow="autoplay; encrypted-media"
        src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/soundcloud%253Aplaylists%253A2306233560&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false">
      </iframe>
    </div>

    <a
      class="rsvp"
      href="https://partiful.com/e/C60TCIZeHIw9OBnTJ1kL"
      target="_blank"
      rel="noopener"
    >RSVP NEOW!</a>
  </main>

  <script src="https://w.soundcloud.com/player/api.js"></script>

  <script>
    const widget = SC.Widget('sc');
    const list = document.getElementById('tracks');
    const wrap = document.querySelector('.poster-wrap');

    const PLAY_ICON = '<svg viewBox="0 0 24 24"><path d="M5.5 3.4 L19.4 11.4 L4.8 20.9 Z" fill="#000" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg>';

    const PAUSE_ICON = '<svg viewBox="0 0 24 24"><path d="M5.6 3.6 L9.8 3.2 L9.2 20.6 L5.2 20.2 Z M14.4 3.8 L18.6 4.3 L18.2 20.4 L14.0 20.8 Z" fill="#000" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/></svg>';

    let sounds = [];
    let current = -1;
    let playing = false;
    let tries = 0;
    let dragging = false;

    function fmt(ms) {
      const s = Math.round(ms / 1000);
      return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    }

    function render() {
      list.innerHTML = '';

      sounds.forEach((s, i) => {
        const li = document.createElement('li');
        li.className = 'track';

        li.innerHTML = '<span class="icon"></span><span class="name"></span><span class="time"></span><span class="bar"></span><span class="knob"></span><span class="scrub"></span>';

        li.querySelector('.icon').innerHTML = PLAY_ICON;
        li.querySelector('.name').textContent = s.title || '...';
        li.querySelector('.time').textContent = s.duration ? fmt(s.duration) : '';

        li.addEventListener('click', () => choose(i));
        attachScrub(li, i);

        list.appendChild(li);
      });
    }

    function clamp01(x) {
      return Math.max(0, Math.min(1, x));
    }

    function setProgress(li, frac) {
      frac = clamp01(frac);
      li.querySelector('.bar').style.width = (frac * 100) + '%';
      li.querySelector('.knob').style.left = (frac * 100) + '%';
    }

    function attachScrub(li, i) {
      const scrub = li.querySelector('.scrub');

      const fracFrom = e => {
        const r = li.getBoundingClientRect();
        return clamp01((e.clientX - r.left) / r.width);
      };

      scrub.addEventListener('click', e => e.stopPropagation());

      scrub.addEventListener('pointerdown', e => {
        if (i !== current) return;

        e.preventDefault();
        e.stopPropagation();

        dragging = true;
        scrub.setPointerCapture(e.pointerId);
        setProgress(li, fracFrom(e));
      });

      scrub.addEventListener('pointermove', e => {
        if (dragging) {
          setProgress(li, fracFrom(e));
        }
      });

      scrub.addEventListener('pointerup', e => {
        if (!dragging) return;

        dragging = false;

        const frac = fracFrom(e);
        setProgress(li, frac);

        widget.getDuration(d => {
          const dur = d || (sounds[current] && sounds[current].duration) || 0;

          if (dur) {
            widget.seekTo(frac * dur);
          }
        });
      });

      scrub.addEventListener('pointercancel', () => {
        dragging = false;
      });
    }

    function choose(i) {
      if (i === current) {
        widget.toggle();
      } else {
        widget.skip(i);
        widget.play();
      }
    }

    function paint() {
      Array.from(list.children).forEach((li, i) => {
        const active = i === current;

        li.classList.toggle('active', active);

        li.querySelector('.icon').innerHTML =
          (active && playing) ? PAUSE_ICON : PLAY_ICON;

        if (!active) {
          setProgress(li, 0);
        }
      });
    }

    function sync() {
      widget.getCurrentSoundIndex(i => {
        current = i;
        paint();
      });
    }

    function hydrate() {
      widget.getSounds(s => {
        sounds = s;
        render();
        sync();

        const missing = s.findIndex(x => !x.title);

        if (missing === -1 || playing || tries++ > 40) {
          if (missing === -1 && !playing) {
            widget.skip(0);
          }

          return;
        }

        widget.skip(missing);
        setTimeout(hydrate, 400);
      });
    }

    widget.bind(SC.Widget.Events.READY, hydrate);

    widget.bind(SC.Widget.Events.PLAY, () => {
      playing = true;
      wrap.classList.add('playing');
      sync();
    });

    widget.bind(SC.Widget.Events.PAUSE, () => {
      playing = false;
      wrap.classList.remove('playing');
      paint();
    });

    widget.bind(SC.Widget.Events.PLAY_PROGRESS, e => {
      if (dragging) return;

      const li = list.children[current];

      if (li && li.querySelector('.bar')) {
        setProgress(li, e.relativePosition);
      }
    });

    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const noise = document.getElementById('noise');
      let n = 0;

      setInterval(() => {
        n = (n % 6) + 1;
        noise.setAttribute('seed', n);
      }, 150);
    }
  </script>
</body>
</html>
