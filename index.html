<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painfully Hueman</title>
  <meta name="description" content="Painfully Hueman is a collective based in New York, founded in 2025. We bring the right people together to make things happen.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css">
  <script>
    /* show the spinning-logo intro once per visit */
    try { if (sessionStorage.getItem('ph-intro-seen')) document.documentElement.classList.add('intro-seen'); } catch (e) {}
  </script>
</head>
<body>
  <!-- INTRO: spinning logo when the site first loads; click to enter -->
  <button class="intro" id="intro" type="button" aria-label="Enter Painfully Hueman" style="touch-action: manipulation">
    <img src="images/reel.png" width="708" height="720" alt="">
  </button>
  <script>
    (function () {
      var intro = document.getElementById('intro');
      if (document.documentElement.classList.contains('intro-seen')) { intro.remove(); return; }
      document.documentElement.classList.add('intro-on');
      intro.focus({ preventScroll: true });
      intro.addEventListener('click', function () {
        if (intro.classList.contains('leaving')) return;   /* ignore extra taps */
        try { sessionStorage.setItem('ph-intro-seen', '1'); } catch (e) {}
        intro.classList.add('leaving');
        /* keep catching taps while it fades, so a second tap can't land on
           the project underneath (on phones that's VOL. 1) */
        intro.style.pointerEvents = 'auto';
        intro.style.cursor = 'default';
        document.documentElement.classList.remove('intro-on');
        setTimeout(function () { intro.remove(); }, 650);
      });
    })();
  </script>

  <header class="site-head">
    <a class="logo" href="./"><img src="images/logo.png" width="1080" height="141" alt="Painfully Hueman."></a>
    <nav class="nav">
      <a href="./" aria-current="page">INDEX</a>
      <a href="inventory-and-armor/">ARMORY</a>
      <a href="editorial/">EDITORIAL</a>
      <a href="huemans/">HUEMANS</a>
      <a href="about/">ABOUT</a>
    </nav>
  </header>

  <main class="projects">
    <a class="project" href="vol-1/">
      <div class="frame"><img src="images/vol-1.jpg" width="1400" height="933" alt="Painfully Hueman Vol. 1 cassette"></div>
      <h2>PAINFULLY HUEMAN VOL. 1</h2>
      <p>Nightlife / Music / New York</p>
    </a>

    <a class="project" href="sex-change/">
      <div class="frame"><img src="images/sex-change.png" width="1400" height="788" alt="Sex Change, Halloween 2026"></div>
      <h2>SEX CHANGE - HALLOWEEN 2026</h2>
      <p>Nightlife / Documentation / New York</p>
    </a>

    <div class="project">
      <div class="frame"><img src="images/sotce.jpg" width="1400" height="787" alt="Sotce at Axel Arigato"></div>
      <h2>SOTCE AT AXEL ARIGATO</h2>
      <p>Production / Installation / New York</p>
    </div>
  </main>
</body>
</html>
