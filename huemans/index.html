<body>
  <header class="site-head">

    <nav class="nav">

      <a href="../about/">ABOUT</a>
    </nav>
  </header>

  <main class="wall" id="wall"></main>

  <script src="people.js"></script>
  <script>
    /* LINKS come from the Google Sheet "Huemans — Links".
       In the sheet: File > Share > Publish to web > (whole document, CSV) > Publish,
       then paste that link between the quotes below. The wall shows straight
       away with the links saved in people.js, then picks up any changes from
       the sheet. In the sheet's "link" column you can type a full URL,
       a website like name.com, or an Instagram handle like @name. */
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQsba8VEur77HJUoVSxaE25r3l5rK1spvO4WPHVqDVMqTtzRMj1UwLz5ZEBFypA-w/pub?output=csv';

    (function () {
      const wall = document.getElementById('wall');
      const people = (window.HUEMANS || []).map(function (p) { return Object.assign({}, p); });

      /* shuffle; if it happens to start the same way as the last visit,
         shuffle again, so the wall never opens in the same order twice */
      function shuffle(list) {
        for (let i = list.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [list[i], list[j]] = [list[j], list[i]];
        }
      }
      let last = '';
      try { last = localStorage.getItem('ph-huemans-start') || ''; } catch (e) {}
      const startOf = function () { return people.slice(0, 3).map(function (p) { return p.img; }).join(','); };
      shuffle(people);
      for (let tries = 0; tries < 5 && people.length > 3 && startOf() === last; tries++) shuffle(people);
      try { localStorage.setItem('ph-huemans-start', startOf()); } catch (e) {}

      /* "@name" -> Instagram, "name.com" -> https://name.com;
         tracking codes (utm_..., fbclid) are taken off the end */
      function cleanLink(raw) {
        let v = (raw || '').trim();
        if (!v) return '';
        if (/^@[\w.]+$/.test(v)) return 'https://www.instagram.com/' + v.slice(1) + '/';
        if (!/^https?:\/\//i.test(v)) {
          if (!/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(v)) return '';
          v = 'https://' + v;
        }
        try {
          const u = new URL(v);
          ['fbclid', 'igshid', 'utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term']
            .forEach(function (k) { u.searchParams.delete(k); });
          return u.toString().replace(/\?$/, '');
        } catch (e) { return ''; }
      }

      function label(link) {
        const m = /instagram\.com\/([^/?#]+)/i.exec(link);
        if (m) return '@' + m[1];
        return link.replace(/^https?:\/\/(www\.)?/i, '').replace(/[?#].*$/, '').replace(/\/$/, '');
      }

      function parseCSV(text) {
        const rows = []; let row = [], cell = '', quoted = false;
        for (let i = 0; i < text.length; i++) {
          const c = text[i];
          if (quoted) {
            if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
            else if (c === '"') quoted = false;
            else cell += c;
          } else if (c === '"') quoted = true;
          else if (c === ',') { row.push(cell); cell = ''; }
          else if (c === '\n' || c === '\r') {
            if (c === '\r' && text[i + 1] === '\n') i++;
            row.push(cell); rows.push(row); row = []; cell = '';
          } else cell += c;
        }
        if (cell || row.length) { row.push(cell); rows.push(row); }
        return rows;
      }

      /* Build the wall once, straight away. Every Polaroid is a link element;
         one without a link simply has no href, so it isn't clickable. */
      const cards = {};
      function setLink(card, raw) {
        const link = cleanLink(raw);
        let tag = card.querySelector('.polaroid-link');
        card.classList.toggle('linked', !!link);
        if (link) {
          card.href = link;
          card.target = '_blank';
          card.rel = 'noopener';
          if (!tag) { tag = document.createElement('span'); tag.className = 'polaroid-link'; card.append(tag); }
          tag.textContent = label(link) + ' ↗';
        } else {
          card.removeAttribute('href');
          card.removeAttribute('target');
          if (tag) tag.remove();
        }
      }
      people.forEach(function (p, i) {
        const card = document.createElement('a');
        card.className = 'polaroid';
        const img = document.createElement('img');
        img.src = '../images/huemans/' + p.img;
        img.alt = p.name + (p.word ? ' — ' + p.word : '');
        img.width = 420;
        img.height = 660;
        img.decoding = 'async';
        if (i > 9) img.loading = 'lazy';
        card.append(img);
        setLink(card, p.link);   /* links saved in people.js: clickable at once */
        cards[p.img] = card;
        wall.append(card);
      });

      /* Then check the Google Sheet for newer links and update them in place. */
      if (!SHEET_URL) return;
      fetch(SHEET_URL, { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.text() : Promise.reject(r.status); })
        .then(function (text) {
          const rows = parseCSV(text);
          const head = (rows.shift() || []).map(function (h) { return h.trim().toLowerCase(); });
          const iPhoto = head.indexOf('photo'), iLink = head.indexOf('link');
          if (iPhoto < 0 || iLink < 0) return;
          const iName = head.indexOf('name');
          const links = {}, byName = {};
          rows.forEach(function (r) {
            if (r[iPhoto]) links[r[iPhoto].trim()] = r[iLink] || '';
            if (iName >= 0 && r[iName] && r[iLink]) byName[r[iName].trim().toLowerCase()] = r[iLink];
          });
          /* match by photo; a photo with no row of its own (e.g. a second
             Polaroid of the same person) uses that person's link */
          people.forEach(function (p) {
            let link = p.link;
            if (p.img in links) link = links[p.img];
            else if (byName[p.name.toLowerCase()]) link = byName[p.name.toLowerCase()];
            if (link !== p.link) { p.link = link; setLink(cards[p.img], link); }
          });
        })
        .catch(function () {});
    })();
  </script>
</body>
</html>
