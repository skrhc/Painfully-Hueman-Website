name: ARMORY submissions

# Runs when the private ADD page sends a new item: cuts out the photos
# and adds the item to inventory-and-armor/added.json.
on:
  push:
    branches: [main]
    paths: ['inventory-and-armor/inbox/**']
  workflow_dispatch:

concurrency:
  group: armory-inbox
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  process:
    runs-on: macos-15
    steps:
      # Always start from the newest main, not the commit that triggered
      # the run: when two items are sent close together, the second run
      # waits in the queue and must see what the first one added.
      - uses: actions/checkout@v4
        with:
          ref: main
      # If main moves while photos are processed (an edit from the ADD page,
      # another push), throw the work away and redo it on the newest main.
      # The inbox is only cleared by a successful push, so nothing is lost.
      - name: Process submissions and commit
        run: |
          git config user.name "armory"
          git config user.email "armory@users.noreply.github.com"
          command -v magick >/dev/null || brew install --quiet imagemagick
          # ffmpeg only when a video is waiting (it takes a minute to install)
          if find inventory-and-armor/inbox -type f 2>/dev/null | grep -qiE '\.(mp4|mov|m4v|webm)$'; then
            command -v ffmpeg >/dev/null || brew install --quiet ffmpeg
          fi
          for i in 1 2 3 4; do
            bash inventory-and-armor/tools/process-inbox.sh
            # photo colors for the spread-out shuffle on the ARMORY page
            python3 inventory-and-armor/tools/colors.py || echo "colors.json not updated"
            git add -A inventory-and-armor
            if git diff --cached --quiet; then echo "Nothing to add."; exit 0; fi
            git commit -q -m "ARMORY: add submitted item(s)"
            if git push -q; then exit 0; fi
            echo "main moved during processing; starting over from the newest main ($i)"
            git fetch -q origin main
            git reset -q --hard origin/main
            git clean -fdq inventory-and-armor
            sleep 5
          done
          exit 1
